<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 498" width="1160" height="498" role="img" aria-label="Docker image build and push to Azure Container Registry">
<title>Docker image build and push to Azure Container Registry</title>

<style>
  :root, svg {
    --bg:#ffffff; --surface:#f6f8fa; --text:#1f2328; --muted:#59636e; --border:#d1d9e0; --frame:#afb8c1;
    --source:#0969da; --source-bg:#ddf4ff;
    --setup:#8250df;  --setup-bg:#fbefff;
    --build:#1a7f37;  --build-bg:#dafbe1;
    --security:#9a6700; --security-bg:#fff8c5;
    --publish:#bf3989; --publish-bg:#ffeff7;
    --dest:#bc4c00;   --dest-bg:#fff1e5;
    --ghpkg:#8250df; --ghcr:#0969da; --nexus:#1a7f37; --acr:#bc4c00;
  }
  @media (prefers-color-scheme: dark) {
    :root, svg {
      --bg:#0d1117; --surface:#161b22; --text:#e6edf3; --muted:#9198a1; --border:#3d444d; --frame:#656c76;
      --source:#4493f8; --source-bg:rgba(56,139,253,.14);
      --setup:#ab7df8;  --setup-bg:rgba(171,125,248,.14);
      --build:#3fb950;  --build-bg:rgba(63,185,80,.14);
      --security:#d29922; --security-bg:rgba(210,153,34,.16);
      --publish:#db61a2; --publish-bg:rgba(219,97,162,.14);
      --dest:#f0883e;   --dest-bg:rgba(240,136,62,.16);
      --ghpkg:#ab7df8; --ghcr:#4493f8; --nexus:#3fb950; --acr:#f0883e;
    }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--text); }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .bg { fill: var(--bg); stroke: var(--border); }
  .muted { fill: var(--muted); }
  .h1 { font-size: 20px; font-weight: 700; }
  .h2 { font-size: 16px; font-weight: 700; }
  .h3 { font-size: 13.5px; font-weight: 600; }
  .frame { fill: var(--surface); stroke: var(--frame); stroke-width: 1.2; }
