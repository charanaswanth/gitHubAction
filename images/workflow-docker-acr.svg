  .chip { fill: var(--bg); stroke: var(--border); }
  .chip-t { font-size: 11px; fill: var(--muted); }
  .step-t { font-size: 12.5px; font-weight: 600; }
  .step-s { font-size: 10px; fill: var(--muted); }
  .kind-t { font-size: 9px; font-weight: 700; letter-spacing: .08em; }
  .cond { stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: var(--muted); stroke-width: 1.6; }
  .ah { fill: var(--muted); }
  .halo { fill: var(--bg); }
  .lane { fill: var(--surface); stroke: var(--frame); stroke-width: 1.2; }
  .node { fill: var(--bg); stroke: var(--border); stroke-width: 1.2; }

  .k-source .box { fill: var(--source-bg); stroke: var(--source); stroke-width: 1.4; }
  .k-source .kind-t, .k-source .dot { fill: var(--source); }

  .k-setup .box { fill: var(--setup-bg); stroke: var(--setup); stroke-width: 1.4; }
  .k-setup .kind-t, .k-setup .dot { fill: var(--setup); }

  .k-build .box { fill: var(--build-bg); stroke: var(--build); stroke-width: 1.4; }
  .k-build .kind-t, .k-build .dot { fill: var(--build); }

  .k-security .box { fill: var(--security-bg); stroke: var(--security); stroke-width: 1.4; }
  .k-security .kind-t, .k-security .dot { fill: var(--security); }

  .k-publish .box { fill: var(--publish-bg); stroke: var(--publish); stroke-width: 1.4; }
  .k-publish .kind-t, .k-publish .dot { fill: var(--publish); }

  .k-dest .box { fill: var(--dest-bg); stroke: var(--dest); stroke-width: 1.4; }
  .k-dest .kind-t, .k-dest .dot { fill: var(--dest); }

  .d-ghpkg .box { fill: var(--bg); stroke: var(--ghpkg); stroke-width: 2; }
  .d-ghpkg .accent { fill: var(--ghpkg); }
  .e-ghpkg { fill: none; stroke: var(--ghpkg); stroke-width: 2; }
  .a-ghpkg { fill: var(--ghpkg); }

  .d-ghcr .box { fill: var(--bg); stroke: var(--ghcr); stroke-width: 2; }
  .d-ghcr .accent { fill: var(--ghcr); }
  .e-ghcr { fill: none; stroke: var(--ghcr); stroke-width: 2; }
  .a-ghcr { fill: var(--ghcr); }

  .d-nexus .box { fill: var(--bg); stroke: var(--nexus); stroke-width: 2; }
  .d-nexus .accent { fill: var(--nexus); }
  .e-nexus { fill: none; stroke: var(--nexus); stroke-width: 2; }
  .a-nexus { fill: var(--nexus); }

  .d-acr .box { fill: var(--bg); stroke: var(--acr); stroke-width: 2; }
  .d-acr .accent { fill: var(--acr); }
  .e-acr { fill: none; stroke: var(--acr); stroke-width: 2; }
  .a-acr { fill: var(--acr); }

</style>

